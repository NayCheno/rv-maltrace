services:
  cva6-toolchain:
    build:
      context: .
      dockerfile: docker/toolchain/Dockerfile
    image: rv-maltrace/cva6-toolchain:ubuntu24.04
    working_dir: /workspace/rv-maltrace
    volumes:
      - .:/workspace/rv-maltrace
      - cva6_toolchain_src:/opt/cva6-toolchain/src
      - cva6_toolchain_build:/opt/cva6-toolchain/build
      - cva6_toolchain_install:/opt/riscv
    environment:
      TOOLCHAIN_CONFIG: ${TOOLCHAIN_CONFIG:-gcc-13.1.0-baremetal}
      NUM_JOBS: ${NUM_JOBS:-8}
      FORCE_REBUILD: ${FORCE_REBUILD:-0}
      RISCV: /opt/riscv
      SRC_DIR: /opt/cva6-toolchain/src
      BUILD_DIR: /opt/cva6-toolchain/build
    command: bash docker/toolchain/build-cva6-toolchain.sh

  linux-behavior:
    build:
      context: .
      dockerfile: docker/linux-behavior/Dockerfile
    image: rv-maltrace/linux-behavior:ubuntu24.04
    working_dir: /workspace/rv-maltrace
    volumes:
      - .:/workspace/rv-maltrace
      - genesys2_cva6_linux_build:/workspace/genesys2-cva6-linux-build
    command: bash

  mirai-safety:
    build:
      context: .
      dockerfile: docker/mirai-safety/Dockerfile
    image: rv-maltrace/mirai-safety:ubuntu24.04
    working_dir: /workspace/rv-maltrace
    volumes:
      - .:/workspace/rv-maltrace
    command: bash

  litex-build:
    build:
      context: .
      dockerfile: docker/litex/Dockerfile
    image: rv-maltrace/litex-build:ubuntu24.04
    working_dir: /workspace/rv-maltrace
    volumes:
      - .:/workspace/rv-maltrace
      - litex_buildroot:/workspace/buildroot
    environment:
      PYTHONPATH: /opt/pythondata-software-picolibc:/workspace/rv-maltrace/vendor/litex/migen:/workspace/rv-maltrace/vendor/litex/litex:/workspace/rv-maltrace/vendor/litex/litex-boards:/workspace/rv-maltrace/vendor/litex/litedram:/workspace/rv-maltrace/vendor/litex/pythondata-cpu-vexriscv_smp
      LITEX_ENV_CC_TRIPLE: riscv64-unknown-elf
    command: bash

  external-mirai-build:
    build:
      context: .
      dockerfile: docker/external-mirai-build/Dockerfile
    image: rv-maltrace/external-mirai-build:ubuntu24.04
    working_dir: /workspace
    volumes:
      - .:/workspace/rv-maltrace:ro
      - ./build/external-mirai:/tmp/build/release
    command: bash /tmp/build/build-external-mirai.sh

volumes:
  cva6_toolchain_src:
  cva6_toolchain_build:
  cva6_toolchain_install:
  litex_buildroot:
  genesys2_cva6_linux_build:
