[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rv-maltrace"
version = "0.1.0"
description = "Build and simulation helpers for the rv-maltrace CVA6 workflow."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
rvmt = "rv_maltrace.cli:main"

[tool.rv-maltrace]
docker = "docker"
docker_compose_file = "docker-compose.toolchain.yml"
docker_service = "cva6-toolchain"

# Change this to your installed Vivado batch executable if it is not in PATH.
# Example: "C:/Xilinx/Vivado/2024.2/bin/vivado.bat"
vivado = "E:/vivado/2025.2/Vivado/bin/vivado.bat"
vivado_board_repo_paths = ["vendor/vivado-boards/new/board_files"]
vivado_subst_drive = "R:"
make = "make.exe"
make_path_prepend = ["D:/env/tools/MinGW/msys/1.0/bin"]

cva6_dir = "rtl/cva6"
board = "genesys2"
# Optional override for the Vivado target. By default these are derived from board.
# Genesys 2 uses xc7k325tffg900-2 and Digilent's genesys2 board file.
# xilinx_part = "xc7k325tffg900-2"
# xilinx_board = "digilentinc.com:genesys2:part0:1.1"
target = "cv64a6_imafdc_sv39"
xlen = 64

# CVA6 top-level Makefile requires RISCV to be set even when the bootrom has
# already been generated by Docker. The bitstream task checks bootrom_64.sv
# before invoking make fpga, so this can remain a placeholder for Windows make.
riscv_placeholder = "/tmp/riscv-placeholder"

toolchain_config = "gcc-13.1.0-baremetal"
num_jobs = 8

[tool.rv-maltrace.env]
# Extra environment variables for all rvmt tasks can be added here.
# EXAMPLE = "value"
